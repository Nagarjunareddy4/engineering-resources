name: Generate engineering resources catalog

on:
  push:
    branches:
      - main
      - master
    paths:
      #- '**/*.md'
      - '**/*.html'
      - '!index.html'
      - '!catalog.json'
      - '.github/workflows/generate-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-resources-catalog
  cancel-in-progress: false

jobs:
  generate-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate catalog.json
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          EXCLUDED_DIRS = {
              ".git", ".github", ".vscode", "node_modules",
              "vendor", "dist", "build", "__pycache__"
          }
          def title_from_path(path: str) -> str:
              name = Path(path).stem
              if name.lower() == "index":
                  return "Overview"
              return name.replace("_", " ").replace("-", " ").strip().title()

          def category_name(folder: str) -> str:
              return folder.replace("_", " ").replace("-", " ").strip().title()

          discovered = {}
          for current, dirs, files in os.walk(ROOT):
              dirs[:] = sorted(d for d in dirs if d not in EXCLUDED_DIRS and not d.startswith("."))
              for filename in sorted(files):
                  path = (Path(current) / filename).as_posix().lstrip("./")
                  suffix = Path(filename).suffix.lower()
                  if filename.startswith(".") or (filename == "index.html" and path == "index.html") or (filename == "catalog.json" and path == "catalog.json"):
                      continue
                  if suffix not in {".md", ".html"}:
                      continue

                  parts = Path(path).parts
                  if len(parts) == 1:
                      category_path = "__root__"
                      category_label = "General"
                  else:
                      category_path = parts[0]
                      category_label = category_name(parts[0])

                  # The root landing page is the catalog itself, not a resource.
                  if path == "index.html":
                      continue

                  item_type = "markdown" if suffix == ".md" else "html"
                  item = {
                      "title": title_from_path(path),
                      "path": path,
                      "type": item_type
                  }
                  discovered.setdefault(category_path, {
                      "name": category_label,
                      "path": category_path,
                      "indexPath": None,
                      "items": []
                  })
                  if suffix == ".html" and len(parts) == 2 and Path(path).name.lower() == "index.html":
                      discovered[category_path]["indexPath"] = path
                  discovered[category_path]["items"].append(item)

          categories = []
          for key in sorted(discovered, key=lambda k: (k == "__root__", k.lower())):
              category = discovered[key]
              category["items"].sort(key=lambda item: (item["path"].lower(), item["title"].lower()))
              category["count"] = len(category["items"])
              categories.append(category)

          catalog = {
              "schemaVersion": 1,
              "repository": "Nagarjunareddy4/engineering-resources",
              "generatedAt": datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z"),
              "categories": categories
          }

          Path("catalog.json").write_text(
              json.dumps(catalog, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )
          print(f"Generated catalog.json: {sum(c['count'] for c in categories)} documents in {len(categories)} categories")
          PY

      - name: Commit updated catalog
        run: |
          if git diff --quiet -- catalog.json; then
            echo "Catalog is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "chore: update engineering resources catalog"
          git push